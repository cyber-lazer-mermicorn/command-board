# validate-constellation.yml
# Canonical workflow from mermicorn-grove — validates mermicorn.repo.yaml
# schema compliance across ALL constellation repos (public + private).
# MERMICORN_PAT gives full org read/write — command-board is the control plane.

name: Validate Constellation

on:
  schedule:
    - cron: '0 8 * * *'   # Nightly 08:00 UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to validate (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate constellation repos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Grove (validator + schemas)
        uses: actions/checkout@v4
        with:
          repository: cyber-lazer-mermicorn/mermicorn-grove
          token: ${{ secrets.MERMICORN_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all repos
        if: ${{ github.event.inputs.repo == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.MERMICORN_PAT }}
        run: python tools/validate_constellation.py --output validation-report.json

      - name: Validate single repo
        if: ${{ github.event.inputs.repo != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.MERMICORN_PAT }}
        run: python tools/validate_constellation.py --repo "${{ github.event.inputs.repo }}" --output validation-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.json
          retention-days: 30

      - name: Post failure summary to command-board issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.MERMICORN_PAT }}
        run: |
          gh issue create \
            --repo cyber-lazer-mermicorn/command-board \
            --title "[Constellation] Validation failed $(date -u +%Y-%m-%d)" \
            --body "Nightly validation detected schema drift. Check the [validation report artifact](https://github.com/cyber-lazer-mermicorn/command-board/actions) for details." \
            --label "constellation,automated"
