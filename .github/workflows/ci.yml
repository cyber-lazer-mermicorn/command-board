name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://command-board.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_STYTCH_PUBLIC_TOKEN: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      STYTCH_PROJECT_ID: placeholder
      STYTCH_SECRET: placeholder
      STYTCH_PROJECT_ENV: test
      VERCEL_TOKEN: placeholder
      MERMICORN_PAT: placeholder
      HUGGINGFACE_API_KEY: placeholder
      AGENT_API_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
